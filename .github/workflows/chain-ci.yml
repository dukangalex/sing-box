name: Chain CI

on:
  push:
    branches:
      - chain-dev
  pull_request:
    branches:
      - chain-dev
  workflow_dispatch:

concurrency:
  group: chain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chain test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/sing-box
