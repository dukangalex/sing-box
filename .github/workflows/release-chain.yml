name: Release Chain Fork

on:
  push:
    tags:
      - 'v*-chain*'
      - 'chain-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v1.12.0-chain.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: android
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS 2>/dev/null || echo "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api")
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${TAGS}" \
            -o "sing-box-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sing-box-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          find artifacts -type f -name 'sing-box-*' -exec cp {} dist/ \;
          cd dist
          for f in sing-box-*; do
            tar -czf "${f}.tar.gz" "$f"
            rm -f "$f"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Chain Fork ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## sing-box Chain Fork Release
            
            This release includes the native **Chain** outbound feature.
            
            ### Feature
            - Native `type: "chain"` outbound for explicit multi-hop proxying
            - Automatic detour wiring at compile time
            - Fail-Closed design
            - Full compatibility with official sing-box core
            
            ### Documentation
            - [Chain Feature Doc](https://github.com/dukangalex/sing-box/blob/chain-dev/docs/CHAIN.md)
            - [Configuration](https://github.com/dukangalex/sing-box/blob/chain-dev/docs/configuration/outbound/chain.md)
            
            ### Usage Example
            ```json
            {
              "type": "chain",
              "tag": "my-chain",
              "outbounds": ["entry", "exit"]
            }
            ```
            
            ### Notes
            - Based on official SagerNet/sing-box
            - Designed for long-term upstream synchronization
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
