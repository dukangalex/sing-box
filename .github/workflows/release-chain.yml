name: Release Chain Fork

on:
  push:
    tags:
      - 'v*-chain*'
      - 'chain-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v1.12.0-chain.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -e
          TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api"
          if [ -f release/DEFAULT_BUILD_TAGS_OTHERS ]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS | tr -d '\n' | tr ' ' ',')
          fi
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          OUT="sing-box-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          echo "Building $OUT with tags: $TAGS"
          go build -v -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${TAGS}" \
            -o "${OUT}" \
            ./cmd/sing-box
          ls -lh "${OUT}"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sing-box-*
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'sing-box-*' -o -name '*.exe' \) 2>/dev/null | while read f; do
            cp "$f" dist/ || true
          done
          cd dist
          count=$(ls -1 2>/dev/null | wc -l)
          echo "Found $count binary files"
          if [ "$count" -eq 0 ]; then
            echo "No binaries found, aborting"
            exit 1
          fi
          for f in *; do
            if [ -f "$f" ]; then
              tar -czf "${f}.tar.gz" "$f"
              rm -f "$f"
            fi
          done
          ls -la

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Chain Fork ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## sing-box Chain Fork (测试版)
            
            原生 **Chain** 链式代理功能测试版本。
            
            ### 使用示例
            ```json
            {
              "type": "chain",
              "tag": "my-chain",
              "outbounds": ["entry", "exit"]
            }
            ```
            
            ### 文档
            - [Chain 功能说明](https://github.com/dukangalex/sing-box/blob/chain-dev/docs/CHAIN.md)
            
            ### 说明
            - 基于官方 SagerNet/sing-box
            - 当前为 Pre-release 测试版
            - 部分平台可能因编译环境限制暂未提供
          files: dist/*
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
